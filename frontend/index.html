<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="app-header">
    <h1>TaskFlow</h1>
    <p class="subtitle">Dark-store engineering task dashboard</p>
  </header>

  <main class="app-main">

    <!-- Sticky add-task form -->
    <section class="add-task-section" aria-labelledby="add-task-heading">
      <h2 id="add-task-heading">Add a Task</h2>
      <form id="add-task-form" novalidate>
        <div class="form-group">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" name="title" placeholder="e.g. Restock shelves" />
          <span class="error-message" id="title-error"></span>
        </div>

        <div class="form-group">
          <label for="task-due-date">Due date (or phrase like "next friday")</label>
          <input type="text" id="task-due-date" name="due_date" placeholder="e.g. tomorrow" />
        </div>

        <div class="form-group">
          <label for="task-priority">Priority</label>
          <select id="task-priority" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="form-group">
          <label for="task-project-id">Project ID</label>
          <input type="number" id="task-project-id" name="project_id" placeholder="e.g. 1" />
        </div>

        <button type="submit">Add Task</button>
      </form>
    </section>

    <!-- Task list container -->
    <section class="task-list-section" aria-labelledby="task-list-heading">
      <h2 id="task-list-heading">Tasks</h2>
      <div id="task-list-container"></div>
    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
